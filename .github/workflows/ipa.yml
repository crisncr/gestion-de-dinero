name: IPA iOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Bajar el código
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Comprobar la dirección de la API
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "Falta el secreto EXPO_PUBLIC_API_URL."
            exit 1
          fi

      - name: Instalar la app
        run: npm ci

      - name: Crear el proyecto de iPhone
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          CI: "1"
        run: npx expo prebuild --platform ios --non-interactive --no-install

      - name: Instalar dependencias nativas
        run: |
          export LANG=en_US.UTF-8
          cd ios
          pod install

      - name: Compilar
        run: |
          find ios -name project.pbxproj -print0 | xargs -0 sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g'
          WS=$(find ios -maxdepth 2 -name '*.xcworkspace' -not -path '*.xcodeproj/*' | head -n 1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Armar el IPA
        run: |
          APP=$(find ios-build/Build/Products -name '*.app' -path '*iphoneos*' | head -n 1)
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r casa360.ipa Payload

      - name: Guardar el IPA en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: casa360-ipa
          path: mobile/casa360.ipa
          if-no-files-found: error

      - name: Publicar el IPA en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-${{ github.run_number }}
          name: Casa360 ${{ github.run_number }}
          files: mobile/casa360.ipa
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
